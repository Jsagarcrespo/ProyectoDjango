<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eliminar usuario</title>
</head>

<body>

    <h1>Eliminar usuario</h1>

    <p>
        Vas a eliminar al usuario:
    </p>

    <p>
        <strong>
            {{ usuario.nombre }} {{ usuario.apellidos }}
        </strong>
    </p>

    <p>
        DNI:
        <strong>{{ usuario.dni }}</strong>
    </p>

    <p>
        ¿Seguro que quieres eliminar este usuario?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar usuario
        </button>

    </form>

    <br>

    <a href="{% url 'detalle_usuario' usuario.id %}">
        Cancelar y volver al detalle
    </a>

    <br><br>

    <a href="{% url 'lista_usuarios' %}">
        Volver a la lista de usuarios
    </a>

</body>

</html>
