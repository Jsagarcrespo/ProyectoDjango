<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crear usuario</title>
</head>

<body>

    <h1>Crear usuario</h1>

    <form method="POST">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit">
            Guardar usuario
        </button>

    </form>

    <br>

    <a href="{% url 'lista_usuarios' %}">
        Cancelar y volver a usuarios
    </a>

</body>

</html>
