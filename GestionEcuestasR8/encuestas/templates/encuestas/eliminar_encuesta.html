<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eliminar encuesta</title>
</head>

<body>

<h1>Eliminar encuesta</h1>

<p>
    ¿Seguro que quieres eliminar:
    <strong>{{ encuesta.titulo }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>

</form>

<br>

<a href="/encuestas/{{ encuesta.id }}/">
    Cancelar
</a>

</body>
</html>
