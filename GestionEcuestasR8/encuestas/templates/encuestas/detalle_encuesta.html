<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detalle encuesta</title>
</head>

<body>

<h1>{{ encuesta.titulo }}</h1>

<p>{{ encuesta.descripcion }}</p>

<p>
    Fecha:
    {{ encuesta.fecha_creacion }}
</p>


<a href="/encuestas/{{ encuesta.id }}/editar/">
    Editar encuesta
</a>

<br><br>

<a href="/encuestas/{{ encuesta.id }}/eliminar/">
    Eliminar encuesta
</a>


<br><br>

<h2>Preguntas</h2>

{% for pregunta in encuesta.preguntas.all %}

    <p>{{ pregunta.texto }}</p>

{% empty %}

    <p>No hay preguntas todavía.</p>

{% endfor %}

<a href="/encuestas/{{ encuesta.id }}/preguntas/crear/">
    Añadir pregunta
</a>



</body>
</html>
