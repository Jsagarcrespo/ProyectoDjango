<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eliminar pregunta</title>
</head>

<body>

    <h1>Eliminar pregunta</h1>

    <p>
        Vas a eliminar una pregunta de la encuesta:
        <strong>{{ encuesta.titulo }}</strong>
    </p>

    <p>
        Pregunta:
        <strong>{{ pregunta.texto }}</strong>
    </p>

    <p>
        ¿Seguro que quieres eliminar esta pregunta?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar pregunta
        </button>

    </form>

    <br>

    <a href="{% url 'detalle_pregunta' encuesta.id pregunta.id %}">
        Cancelar y volver al detalle de la pregunta
    </a>

    <br><br>

    <a href="{% url 'detalle_encuesta' encuesta.id %}">
        Volver al detalle de la encuesta
    </a>

</body>

</html>
