<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar pregunta</title>
</head>

<body>

    <h1>Editar pregunta</h1>

    <h2>Encuesta: {{ encuesta.titulo }}</h2>

    <form method="POST">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="{% url 'detalle_pregunta' encuesta.id pregunta.id %}">
        Cancelar y volver al detalle de la pregunta
    </a>

    <br><br>

    <a href="{% url 'detalle_encuesta' encuesta.id %}">
        Volver al detalle de la encuesta
    </a>

</body>

</html>
