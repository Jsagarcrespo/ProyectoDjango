<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crear opción</title>
</head>

<body>

    <h1>Crear opción</h1>

    <h2>Encuesta: {{ encuesta.titulo }}</h2>

    <p>
        <strong>Pregunta:</strong>
        {{ pregunta.texto }}
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit">
            Guardar opción
        </button>

    </form>

    <br>

    <a href="{% url 'detalle_pregunta' encuesta.id pregunta.id %}">
        Cancelar y volver al detalle de la pregunta
    </a>

</body>

</html>
