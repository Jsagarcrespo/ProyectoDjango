<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detalle opción</title>
</head>

<body>

    <h1>Detalle de opción</h1>

    <p>
        <strong>Encuesta:</strong>
        {{ encuesta.titulo }}
    </p>

    <p>
        <strong>Pregunta:</strong>
        {{ pregunta.texto }}
    </p>

    <p>
        <strong>Opción:</strong>
        {{ opcion.texto }}
    </p>

    <br>

    <a href="{% url 'detalle_pregunta' encuesta.id pregunta.id %}">
        Volver al detalle de la pregunta
    </a>

    <br><br>

    <a href="{% url 'crear_opcion' encuesta.id pregunta.id %}">
        Añadir otra opción
    </a>

</body>

</html>
